name: check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the newest Empty
        run: curl -fsSL https://empty.rcusahlberg.se/download/Empty-mac.tar.gz | tar xz
      - name: Check the module in a fresh app home
        run: |
          engine="$PWD/Empty.app/Contents/MacOS/empty-engine"
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/modules"
          cp -R messages-messenger "$home/modules/"
          (sleep 900 | "$engine" --home "$home" --secrets-service empty-recipe-ci) &
          for _ in $(seq 1 60); do "$engine" cli status --home "$home" >/dev/null 2>&1 && break; sleep 2; done
          "$engine" cli check messages-messenger --home "$home"
